
substitutions:
  name: heatpump
  friendlyName: Heatpump

esphome:
  name: ${name}
  friendly_name: ${friendlyName}

external_components:
#  - source: github://tobias-93/esphome-ecodan-heatpump@future-climate-2zone
  - source: github://hallonstedt/esphome-ecodan-heatpump@heat-stage-logging
    components: [ecodan]
    refresh: always

logger:
  baud_rate: 0

esp8266:
  board: esp01_1m

ota:
  - platform: esphome
    password: !secret heatpump_ota_password

api:
  encryption:
    key: !secret heatpump_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
# Hardening: no captive_portal, no AP

web_server:
  port: 80

time:
  - platform: homeassistant
    id: homeassistant_time

uart:
  id: ecodan_uart
  baud_rate: 2400
  tx_pin: GPIO1
  rx_pin: GPIO3
  rx_buffer_size: 1024
  parity: EVEN

ecodan:
  id: ecodan_instance
  uart_id: ecodan_uart

text_sensor:
  - platform: version
    name: ESPHome Version
  - platform: wifi_info
    ip_address:
      name: IP
    ssid:
      name: SSID
    bssid:
      name: BSSID
  - platform: ecodan
    date_time:
      name: Current date/time
    defrost:
      name: Defrost
    input_power_band:
      name: Input power band
    heating_stage:
      name: Heating stage
    heat_source_mode:
      name: Heat source mode
    hot_water_phase:
      name: Hot water phase
    operating_mode:
      name: Operating mode
    heat_cool:
      name: Heating/cooling
    hot_water_timer:
      name: Hot water timer
    dhw_forced:
      name: Forced DHW
    date_energy_cons:
      name: Date energy consumption
    date_energy_prod:
      name: Date energy production      
    holiday_mode:
      name: Holiday mode

sensor:
  - platform: uptime
    name: Uptime
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s
  - platform: ecodan
    error_code:
      name: Error code
    frequency:
      name: Frequency
    output_power:
      name: Output power
    input_power:
      name: Input power
    zone1_room_temperature:
      name: Zone 1 Room temperature
    zone2_room_temperature:
      name: Zone 2 Room temperature
    gas_return_temp_signed:
      name: Gas return temperature
    outside_temperature:
      name: Outside temperature
    water_feed_temp_signed:
      name: Water feed temperature
    water_return_temp_signed:
      name: Water return temperature
    hot_water_temperature:
      name: Hot water temperature
    legionella_temp_setpoint:
      name: Legionella temperature setpoint
    runtime:
      name: Runtime
    primary_current_limit_raw:
      name: Primary current limit (raw)
    mixing_tank_temperature:
      name: Mixing tank temperature
    condenser_temperature:
      name: Condenser temperature
    water_flow:
      name: Water flow
    booster_stage_1_active:
      name: Booster stage 1 active
    booster_stage_2_active:
      name: Booster stage 2 active
    immersion_heater_active:
      name: Immersion heater active
    energy_cons_yesterday:
      name: Heating energy consumption (yesterday)
      id: energy_cons_yesterday
    energy_prod_yesterday:
      name: Heating energy production (yesterday)
      id: energy_prod_yesterday
    energy_cooling_cons_yesterday:
      name: Cooling energy consumption (yesterday)
    energy_cooling_prod_yesterday:
      name: Cooling energy production (yesterday)
    energy_dhw_cons_yesterday:
      name: Hot water energy consumption (yesterday)
      id: energy_dhw_cons_yesterday
    energy_dhw_prod_yesterday:
      name: Hot water energy production (yesterday)
      id: energy_dhw_prod_yesterday
    energy_consumed_increasing:
      name: Total energy consumed
    pump_pwm:
      name: Pump PWM
    pump_feedback:
      name: Pump feedback
    mixing_valve_step:
      name: Mixing valve step
    mixing_valve_status:
      name: Mixing valve status
  # Calculated CoP (yesterday) as ratio of production/consumption
  - platform: template
    name: "CoP (yesterday)"
    id: cop_yesterday
    lambda: |-
      float prod = id(energy_prod_yesterday).state;
      float cons = id(energy_cons_yesterday).state;
      if (!std::isfinite(prod) || !std::isfinite(cons) || cons <= 0.0) {
        return NAN;
      }
      return prod / cons;
    state_class: measurement
    accuracy_decimals: 2
  - platform: template
    name: "DHW CoP (yesterday)"
    id: dhw_cop_yesterday
    lambda: |-
      float prod = id(energy_dhw_prod_yesterday).state;
      float cons = id(energy_dhw_cons_yesterday).state;
      if (!std::isfinite(prod) || !std::isfinite(cons) || cons <= 0.0) {
        return NAN;
      }
      return prod / cons;
    state_class: measurement
    accuracy_decimals: 2
  - platform: template
    name: "Total CoP (yesterday)"
    id: total_cop_yesterday
    lambda: |-
      float prod_heat = id(energy_prod_yesterday).state;
      float prod_dhw  = id(energy_dhw_prod_yesterday).state;
      float cons_heat = id(energy_cons_yesterday).state;
      float cons_dhw  = id(energy_dhw_cons_yesterday).state;
      // Only include subsystems that have a finite, positive consumption
      float total_prod = 0.0;
      float total_cons = 0.0;
      if (std::isfinite(cons_heat) && cons_heat > 0.1 && std::isfinite(prod_heat) && prod_heat > 0.1) {
        total_prod += prod_heat;
        total_cons += cons_heat;
      }
      if (std::isfinite(cons_dhw) && cons_dhw > 0.1 && std::isfinite(prod_dhw) && prod_dhw > 0.1) {
        total_prod += prod_dhw;
        total_cons += cons_dhw;
      }
      if (total_cons <= 0.0) return NAN;
      return total_prod / total_cons;
    state_class: measurement
    accuracy_decimals: 2

binary_sensor:
  - platform: ecodan
    status_defrost:
      name: Defrost active
    status_compressor:
      name: Compressor running
    status_in1_request:
      name: Thermostat In1 request
    status_in6_request:
      name: Thermostat In6 request
    status_in5_request:
      name: Outdoor thermostat request
    status_booster:
      name: Booster heater 1
    status_booster_2:
      name: Booster heater 2
    status_immersion:
      name: Immersion heater
    status_water_pump:
      name: Water pump
    status_water_pump_2:
      name: Water pump 2
    status_water_pump_3:
      name: Water pump 3
    status_three_way_valve:
      name: 3-way valve
    status_three_way_valve_2:
      name: 3-way valve 2
    status_dhw_forced:
      name: Forced DHW
    status_holiday:
      name: Holiday mode
    status_prohibit_dhw:
      name: DHW prohibit
    status_prohibit_heating_z1:
      name: Heating prohibit Z1
    status_prohibit_cool_z1:
      name: Cooling prohibit Z1
    status_prohibit_heating_z2:
      name: Heating prohibit Z2
    status_prohibit_cool_z2:
      name: Cooling prohibit Z2
    status_server_control:
      name: Server control
    status_power:
      name: Power state
    status_dhw_eco:
      name: DHW eco

switch:
  - platform: ecodan
    power_state:
      name: Power state
    force_dhw:
      name: Force DHW
    holiday_mode:
      name: Holiday Mode

select:
  - platform: ecodan
    # Legacy single key (maps to zone1). Prefer using zone specific keys below.
    # mode_select:
    #   name: Mode
    mode_select_zone1:
      name: Mode Zone 1
    mode_select_zone2:
      name: Mode Zone 2
    hot_water_mode:
      name: Hot water mode

number:
  - platform: ecodan
    hot_water_setpoint:
      name: Hot water setpoint
    zone1_flow_temp_setpoint:
      name: Zone 1 Flow temperature setpoint
    zone2_flow_temp_setpoint:
      name: Zone 2 Flow temperature setpoint
    zone1_room_temp_setpoint:
      name: Zone 1 Room temperature setpoint
    zone2_room_temp_setpoint:
      name: Zone 2 Room temperature setpoint

# Climate entities for zone temperature control (alternative to number entities above)
climate:
  - platform: ecodan
    zone1:
      name: "Zone 1 Thermostat"
    zone2:
      name: "Zone 2 Thermostat"
